name: MediSync Clinical Offline Verification
on:
  push:
    branches: [main, release/medisync-v1-final-integration]
  pull_request:
    branches: [main, chore/safe-localhost-development]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-integrity-and-offline-tests:
    env:
      MONGOMS_DISABLE_POSTINSTALL: '1'
      MONGOMS_RUNTIME_DOWNLOAD: 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # reviewed v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # reviewed v7
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # reviewed v7
        with:
          python-version: '3.11'
      - name: Install reviewed locked dependencies
        run: |
          npm ci
          npm --prefix server ci
          npm --prefix client ci
          python -m venv ml-engine/.venv
          ml-engine/.venv/bin/python -m pip install -r ml-engine/requirements.txt
          ml-engine/.venv/bin/python -m pip check
      - name: Run actual offline profiles and authorized hash chain
        env:
          MEDISYNC_OFFLINE_CI: 'true'
        run: node scripts/run_offline_tests.js
      - name: Build isolated clinical source without environment files or network
        env:
          NODE_ENV: production
          BABEL_ENV: production
          CI: 'false'
          MEDISYNC_COMBINED_MODE: build
          MEDISYNC_COMBINED_EVIDENCE: ${{ github.workspace }}/scratch/ci-build
          BUILD_PATH: ${{ github.workspace }}/scratch/ci-build/build
          REACT_APP_API_URL: https://backend.example.invalid/api
          REACT_APP_SERVER_URL: https://backend.example.invalid
          GENERATE_SOURCEMAP: 'false'
        run: |
          mkdir -p scratch/ci-build
          node --require ./scripts/agent_b_combined_boundary.cjs scripts/agent_b_combined_child.cjs
      - name: Declare clinical execution boundary
        run: echo 'NOT RUN - Atlas preservation, authenticated five-role E2E, providers and deployments require separate authorization. No mock-browser result represents clinical E2E.'
