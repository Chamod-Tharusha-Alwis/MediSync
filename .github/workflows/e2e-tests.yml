name: End-to-End Walkthrough Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
      mongo:
        image: mongo:latest
        ports:
          - 27017:27017
      vault:
        image: hashicorp/vault:latest
        ports:
          - 8200:8200
        env:
          VAULT_DEV_ROOT_TOKEN_ID: myroot
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Bootstrap Vault Keys
        run: |
          sleep 2
          curl -H "X-Vault-Token: myroot" \
               -H "Content-Type: application/json" \
               -d '{"data": {"activeVersion": 1, "versions": {"1": "my-secret-key-v1-32-bytes-long!!!"}}}' \
               http://127.0.0.1:8200/v1/secret/data/medisync/keys

      - name: Install ML Engine Dependencies
        working-directory: ./ml-engine
        run: pip install -r requirements.txt

      - name: Start ML Engine
        working-directory: ./ml-engine
        env:
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
        run: python app.py &

      - name: Install Server Dependencies
        working-directory: ./server
        run: npm ci

      - name: Start Node Server (Test Mode)
        working-directory: ./server
        env:
          PORT: 5005
          MONGO_URI: "mongodb://localhost:27017/medisync_test"
          VAULT_TOKEN: "myroot"
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          NODE_ENV: "test"
          TEST_MODE: "true"
          REDIS_HOST: "localhost"
          REDIS_PORT: 6379
        run: npm start &

      - name: Install Client Dependencies
        working-directory: ./client
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: ./client
        run: npx playwright install --with-deps chromium

      - name: Start React App
        working-directory: ./client
        env:
          PORT: 3000
          REACT_APP_API_URL: "http://localhost:5005/api"
        run: npm start &

      - name: Wait for services to be ready
        run: |
          npx wait-on http://localhost:5005/api/public/stats
          npx wait-on http://localhost:3000

      - name: Run Playwright Tests
        working-directory: ./client
        env:
          MONGO_URI: "mongodb://localhost:27017/medisync_test"
        run: npx playwright test tests/medisync-e2e-walkthrough.spec.js
