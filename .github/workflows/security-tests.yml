name: Security Hardening Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-tests:
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
      mongo:
        image: mongo:latest
        ports:
          - 27017:27017
      vault:
        image: hashicorp/vault:latest
        ports:
          - 8200:8200
        env:
          VAULT_DEV_ROOT_TOKEN_ID: myroot
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install ML Engine Dependencies
        run: |
          cd ml-engine
          pip install -r requirements.txt

      - name: Start ML Engine (Background)
        run: |
          cd ml-engine
          python app.py &
        env:
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}

      - name: Run Security Tests
        run: ./server/scripts/test_security.sh

      - name: Install Server Dependencies
        working-directory: ./server
        run: npm ci

      - name: Install ML Engine Dependencies
        working-directory: ./ml-engine
        run: pip install -r requirements.txt

      - name: Bootstrap Vault Keys
        run: |
          curl -H "X-Vault-Token: myroot" \
               -H "Content-Type: application/json" \
               -d '{"data": {"activeVersion": 1, "versions": {"1": "my-secret-key-v1-32-bytes-long!!!"}}}' \
               http://127.0.0.1:8200/v1/secret/data/medisync/keys

      - name: Bootstrap Vault Keys
        run: |
          curl -H "X-Vault-Token: myroot" \
               -H "Content-Type: application/json" \
               -d '{"data": {"activeVersion": 1, "versions": {"1": "12345678901234567890123456789012"}}}' \
               http://127.0.0.1:8200/v1/secret/data/medisync/keys

      - name: Start ML Engine
        working-directory: ./ml-engine
        env:
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
        run: python app.py > ml_engine.log 2>&1 &

      - name: Start Node Server
        working-directory: ./server
        env:
          PORT: 5000
          MONGO_URI: "mongodb://localhost:27017/medisync_test"
          VAULT_TOKEN: "myroot"
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          ADMIN_PASSWORD: "SecureCiAdminPassword2026!"
          NODE_ENV: "production"
          REDIS_HOST: "localhost"
          REDIS_PORT: 6379
          JWT_SECRET: "dummy-secret-for-ci-tests"
        run: node src/app.js > server.log 2>&1 &

      - name: Make Security Test Script Executable
        working-directory: ./server
        run: chmod +x scripts/test_security.sh

      - name: Run Security Tests
        working-directory: ./server
        run: timeout 30 ./scripts/test_security.sh

      - name: Dump Server Logs on Failure
        if: failure()
        working-directory: ./server
        run: cat server.log
