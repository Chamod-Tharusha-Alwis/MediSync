name: Security Hardening & Trust Governance Tests

on:
  push:
    branches: [ "main", "release/medisync-v1-final-integration" ]
  pull_request:
    branches: [ "main", "chore/safe-localhost-development" ]
  workflow_dispatch:

jobs:
  security-and-trust-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Server Dependencies
        working-directory: ./server
        run: npm ci

      - name: Execute Security & Cryptographic Suites (71 Tests)
        working-directory: ./server
        run: npx jest tests/qaTrustLedger.test.js tests/qaEncryptionBootstrap.test.js tests/qaNativeDriverPolicy.test.js tests/dbGuard.test.js

      - name: Execute Clinical & Security Integration Suites (39 Tests)
        working-directory: ./server
        run: npx jest tests/clinicalAuditSafety.test.js tests/clinicalAuditService.test.js tests/labEncryptionStorageAdapter.test.js tests/clinicalHttpWorkflow.test.js tests/cloudinaryCompatibility.test.js tests/dispensingTransaction.test.js

