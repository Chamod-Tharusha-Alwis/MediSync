name: Security Hardening Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-tests:
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
      mongo:
        image: mongo:latest
        ports:
          - 27017:27017
      vault:
        image: hashicorp/vault:latest
        ports:
          - 8200:8200
        env:
          VAULT_DEV_ROOT_TOKEN_ID: myroot
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install ML Engine Dependencies
        working-directory: ./ml-engine
        run: pip install -r requirements.txt

      - name: Start ML Engine (Background)
        working-directory: ./ml-engine
        env:
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
        run: python app.py > ml_engine.log 2>&1 &

      - name: Install Server Dependencies
        working-directory: ./server
        run: npm install

      - name: Bootstrap Vault Keys
        run: |
          sleep 2
          curl -H "X-Vault-Token: myroot" \
               -H "Content-Type: application/json" \
               -d '{"data": {"activeVersion": 1, "versions": {"1": "12345678901234567890123456789012"}}}' \
               http://127.0.0.1:8200/v1/secret/data/medisync/keys

      - name: Create .env file
        working-directory: ./server
        run: |
          echo "JWT_SECRET=dummy-secret-for-ci-tests" > .env
          echo "JWT_REFRESH_SECRET=dummy-refresh-secret-for-ci-tests" >> .env
          echo "ADMIN_PASSWORD=SecureCiAdminPassword2026!" >> .env
          echo "INTERNAL_API_KEY=${{ secrets.INTERNAL_API_KEY }}" >> .env
          echo "PORT=5000" >> .env
          echo "MONGO_URI=mongodb://localhost:27017/medisync_test" >> .env
          echo "NODE_ENV=production" >> .env
          echo "REDIS_HOST=localhost" >> .env
          echo "REDIS_PORT=6379" >> .env
          echo "VAULT_TOKEN=myroot" >> .env
          echo "VAULT_ADDR=http://127.0.0.1:8200" >> .env
          echo "ENCRYPTION_KEY=12345678901234567890123456789012" >> .env

      - name: Start Node Server
        working-directory: ./server
        run: node src/app.js > server.log 2>&1 &

      - name: Run Security Tests
        run: |
          chmod +x server/scripts/test_security.sh
          timeout 30 ./server/scripts/test_security.sh

      - name: Dump Logs on Failure
        if: failure()
        run: |
          echo "=== NODE SERVER LOGS ==="
          cat ./server/server.log || true # Added ./server/ prefix
          echo "=== ML ENGINE LOGS ==="
          cat ./ml-engine/ml_engine.log || true # Added ./ml-engine/ prefix
