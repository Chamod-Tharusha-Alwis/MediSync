name: Security Hardening & Trust Governance Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-and-trust-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Server Dependencies
        working-directory: ./server
        run: npm ci

      - name: Execute Security & Cryptographic Suites (71 Tests)
        working-directory: ./server
        run: npx jest tests/qaTrustLedger.test.js tests/qaEncryptionBootstrap.test.js tests/qaNativeDriverPolicy.test.js tests/dbGuard.test.js
