version: '3.8'

networks:
  medisync-internal:
    driver: bridge

services:
  server:
    build: ./server
    ports:
      - "127.0.0.1:5000:5000"
    env_file:
      - ./server/.env
    restart: unless-stopped
    depends_on:
      - redis
    networks:
      - medisync-internal

  redis:
    image: redis:alpine
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    networks:
      - medisync-internal

  ml-engine:
    build: ./ml-engine
    ports:
      - "127.0.0.1:5001:5001"
    env_file:
      - ./ml-engine/.env
    restart: unless-stopped
    networks:
      - medisync-internal

  client:
    build: ./client
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - PORT=3000
    restart: unless-stopped
    depends_on:
      - server
      - ml-engine
    networks:
      - medisync-internal
